name: Build and publish Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: WebUI/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content -Raw Directory.Build.props)).Project.PropertyGroup.Version | Select-Object -First 1
          if (-not $version) { throw 'Version not found in Directory.Build.props' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw "Tag $env:GITHUB_REF_NAME does not match version $version" }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Build WebUI, app, uninstaller and installer from sources
        shell: pwsh
        run: ./build-release.ps1
      - name: Run tests
        run: dotnet test tests/UzbekKeyboard.Tests -c Release
      - name: Compute SHA-256
        shell: pwsh
        run: |
          Set-Location dist
          Get-FileHash -Algorithm SHA256 -LiteralPath 'Yangi-Lotin-Setup.exe','Yangi-Lotin-Portable.zip' |
            ForEach-Object { '{0}  {1}' -f $_.Hash.ToLowerInvariant(), (Split-Path -Leaf $_.Path) } |
            Set-Content -Encoding utf8NoBOM SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA --title "Yangi lotin klaviatura $version" --notes-file RELEASE-NOTES.md
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload $tag 'dist/Yangi-Lotin-Setup.exe' 'dist/Yangi-Lotin-Portable.zip' 'dist/SHA256SUMS.txt' --clobber
          exit $LASTEXITCODE
